<!DOCTYPE html>
<html>
<head>
<title>Universities in Luxembourg</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    display: flex;
}

/* LEFT SIDEBAR */
.sidebar {
    width: 220px;
    background: #003366;
    color: white;
    padding: 20px;
    height: 100vh;
}

.sidebar h2 {
    font-size: 18px;
}

.sidebar select {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
}

/* RIGHT CONTENT */
.main {
    flex: 1;
    background: #f5f5f5;
    padding: 20px;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
}

.info-line {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
}

.apply {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: black;
    color: white;
    text-decoration: none;
}

.map-link {
    color: #007bff;
    text-decoration: none;
}

.map-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Filter</h2>

<select id="typeFilter" onchange="filterUniversities()">
<option value="all">All Types</option>
<option value="Public">Public</option>
<option value="Private">Private</option>
<option value="Business">Business School</option>
</select>

</div>

<!-- MAIN CONTENT -->
<div class="main">

<h1>Universities in Luxembourg 🌍</h1>

<!-- University -->
<div class="card" data-type="Public">
<h2>University of Luxembourg</h2>
<div class="info-line">
<span>📍 <a class="map-link" href="https://www.google.com/maps?q=University+of+Luxembourg" target="_blank">Esch-sur-Alzette</a></span>
<span>Established: 2003</span>
<span>Type: Public</span>
<span>Visa: Easy</span>
<span>Fees: €500–€800</span>
</div>
<a href="https://www.uni.lu/en/admissions/" target="_blank" class="apply">Apply</a>
</div>

<!-- L22 -->
<div class="card" data-type="Business">
<h2>L22 School of Business</h2>
<div class="info-line">
<span>📍 <a class="map-link" href="https://www.google.com/maps?q=L22+School+of+Business" target="_blank">Gare</a></span>
<span>Established: 2022</span>
<span>Type: Business School</span>
<span>Visa: Medium</span>
<span>Fees: €6,000–€9,000</span>
</div>
<a href="https://www.l22schoolofbusiness.com/" target="_blank" class="apply">Apply</a>
</div>

</div>

<script>
function filterUniversities() {
    let type = document.getElementById("typeFilter").value;
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let cardType = card.getAttribute("data-type");

        if (type === "all" || cardType === type) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
